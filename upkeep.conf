# /etc/upkeep.conf - settings for the upkeep script

# Your normal login name (the installer fills this in)
USER=

# bazzite or steamos (the installer / Decky setup page fills this in)
DISTRO=

# Where the upkeep script lives (set by the installer)
UPKEEP_PATH=

# What to update each night (yes/no). "no" = just report what's available.
UPDATE_SYSTEM=yes
UPDATE_FLATPAKS=yes
UPDATE_DECKY=yes
UPDATE_PLUGINS=yes

# Plugins to leave on their current version (comma-separated names, as shown in
# Decky). New versions are still reported. For plugins you've patched by hand:
# an update would replace the patch.
HOLD_PLUGINS=

# If the PC woke from sleep just for upkeep, put it back to sleep afterwards
SLEEP_AFTER_WAKE=yes

# If a game is open at run time, keep waiting up to this many hours
GAME_WAIT_HOURS=6

# Housekeeping
KEEP_REPORTS_DAYS=30
KEEP_BACKUPS=5
